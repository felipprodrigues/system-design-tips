name: Announce Lesson on LinkedIn

on:
  pull_request:
    types: [closed]

jobs:
  post:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'lesson/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/create-linkedin-issue.mjs "${{ github.event.pull_request.head.ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
